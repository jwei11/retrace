name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Light install: the tests need no GPU, model weights or dataset (data-dependent tests skip).
      - run: >
          PYTHONPATH=src uv run --no-project --python 3.11
          --with pytest,numpy,pandas,pyarrow,pillow,timezonefinder,astral,shapely,pyyaml,requests
          pytest -q
